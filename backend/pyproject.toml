[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "neo4j>=6.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.10.1",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.49.0",
    "vnstock>=4.0.4",
    "crewai[google-genai]>=1.14.6",
    "litellm>=1.87.0",
    "trafilatura>=2.0.0",
    "playwright>=1.49.0",
]

[dependency-groups]
# Sau khi cài dev deps, chạy một lần: `uv run playwright install chromium`
# để tải trình duyệt chromium cho Playwright_Fallback.
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.100.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Mặc định loại các test cần mạng để suite không fail khi offline/CI.
# Chạy chúng tường minh bằng: `pytest -m network`.
addopts = "-m 'not network'"
markers = [
    "network: test gọi mạng thật tới nguồn ngoài (mặc định bị loại; chạy với `-m network`)",
]

